<text y="152"><tspan x="22.0" fill="#39c5cf">   │   ●   │</tspan><tspan x="123.2">   </tspan><tspan x="148.4" fill="#8b949e">AES-256-GCM · Windows · macOS · Android · iPhone</tspan></text>
